<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav-bar</title>

        </div>

            <ul>
                <li class="tabs active">Home</li>

                <li class="tabs">Projects</li>
                <li class="tabs">About</li>
                <li class="tabs">Contact</li>

            <div class="download-resume-button">

<script src="main.js"></script>
