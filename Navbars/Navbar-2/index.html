<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="nav-bar">
        <div class="logo-content">
            <p class="logo-name-1">Code</p>
            <p class="logo-name-2">Rush</p>
        </div>
        <div class="menu">
            <ul>
                <li class="tab"><i class="fa-regular fa-house"></i>Home</li>
                <li class="tab"><i class="fa-solid fa-chart-line"></i>Dashboard</li>
                <li class="tab"><i class="fa-solid fa-tag"></i>Pricing</li>
            </ul>
        </div>
        <div class="last-part">
             <i class="fa-solid fa-circle-half-stroke"></i>
            <div class="get-started-btn">
                <Button>Get Started</Button>
                <i class="fa-solid fa-chevron-right" id="btn-icon"></i>
            </div>
        </div>
    </div>
</body>
<script src="main.js"></script>
</html>
